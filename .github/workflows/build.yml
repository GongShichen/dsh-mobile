name: Build mobile clients
on:
  push:
  pull_request:
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
      - run: sdkmanager 'platforms;android-37.0' 'build-tools;37.0.0' 'ndk;27.1.12297006'
      - uses: dtolnay/rust-toolchain@1.94.1
        with:
          targets: aarch64-linux-android
      - run: IROH_ANDROID_TARGETS=aarch64-linux-android scripts/HLBuildIrohAndroid.sh
      - run: ./gradlew :androidApp:assembleDebug :core:database:testAndroidHostTest :core:protocol:testAndroidHostTest :core:sync:testAndroidHostTest
      - uses: actions/upload-artifact@v4
        with:
          name: harness-link-android-debug
          path: androidApp/build/outputs/apk/debug/*.apk
  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.5'
      - run: brew install xcodegen
      - run: scripts/HLBuildIOS.sh
