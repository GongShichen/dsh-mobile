name: DshMobile
options:
  bundleIdPrefix: org.harnesslink
  deploymentTarget:
    iOS: "17.5"
  xcodeVersion: "27.2"
packages:
  Iroh:
    url: https://github.com/n0-computer/iroh-ffi.git
    exactVersion: 1.2.0
settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.5"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    DEVELOPMENT_TEAM: "$(DSH_DEVELOPMENT_TEAM)"
    CODE_SIGN_STYLE: Automatic
    APS_ENVIRONMENT: development
    DSH_PUSH_ENABLED: "YES"
    "ARCHS[sdk=iphonesimulator*]": arm64
    "CODE_SIGN_IDENTITY[sdk=iphonesimulator*]": "-"
  configs:
    Release:
      APS_ENVIRONMENT: production
targets:
  DshMobile:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: ../composeApp/build/xcode-generated/KotlinBuildStamp.swift
        type: file
        optional: true
        buildPhase: sources
      - path: Resources
        buildPhase: resources
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Harness Link
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        DSHAPNsEnvironment: "$(APS_ENVIRONMENT)"
        DSHSigningTeam: "$(DEVELOPMENT_TEAM)"
        DSHPushEnabled: "$(DSH_PUSH_ENABLED)"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIApplicationSupportsIndirectInputEvents: true
        CADisableMinimumFrameDurationOnPhone: true
        NSCameraUsageDescription: Scan a pairing code on your computer to connect to DeepSeek Harness.
        NSLocalNetworkUsageDescription: Connect directly to your paired DeepSeek Harness computer on the local network.
        UIBackgroundModes:
          - remote-notification
    entitlements:
      path: DshMobile.entitlements
      properties:
        aps-environment: "$(APS_ENVIRONMENT)"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.harnesslink.app
        PRODUCT_NAME: DshMobile
        PRODUCT_MODULE_NAME: DshMobileApp
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
        TARGETED_DEVICE_FAMILY: "1,2"
        FRAMEWORK_SEARCH_PATHS:
          - "$(inherited)"
          - "$(SRCROOT)/../composeApp/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)"
        OTHER_LDFLAGS:
          - "$(inherited)"
          - "-lsqlite3"
    dependencies:
      - package: Iroh
        product: IrohLib
      - framework: ../composeApp/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)/DshMobile.framework
        embed: false
        link: true
    preBuildScripts:
      - name: Build shared Kotlin framework
        script: |
          set -eu
          cd "$SRCROOT/.."
          ./gradlew :composeApp:embedAndSignAppleFrameworkForXcode
          framework="$SRCROOT/../composeApp/build/xcode-frameworks/$CONFIGURATION/$SDK_NAME/DshMobile.framework/DshMobile"
          stamp="$SRCROOT/../composeApp/build/xcode-generated/KotlinBuildStamp.swift"
          mkdir -p "$(dirname "$stamp")"
          fingerprint=$(shasum -a 256 "$framework" | cut -d ' ' -f 1)
          printf 'internal enum DshKotlinBuildStamp { static let sha256 = "%s" }\n' "$fingerprint" > "$stamp.tmp"
          if ! cmp -s "$stamp.tmp" "$stamp"; then mv "$stamp.tmp" "$stamp"; else rm "$stamp.tmp"; fi
        basedOnDependencyAnalysis: false
        outputFiles:
          - "$(SRCROOT)/../composeApp/build/xcode-generated/KotlinBuildStamp.swift"
  DshMobileUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: DshMobile
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.harnesslink.app.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: DshMobile
        TARGETED_DEVICE_FAMILY: "1,2"
schemes:
  DshMobile:
    build:
      targets:
        DshMobile: all
        DshMobileUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - name: DshMobileUITests
          parallelizable: false
          randomExecutionOrder: false
      environmentVariables:
        DSH_UI_PAIRING: "$(DSH_UI_PAIRING)"
    archive:
      config: Release
