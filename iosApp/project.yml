name: DshMobile
options:
  bundleIdPrefix: io.github.gongshichen
  deploymentTarget:
    iOS: "17.5"
  xcodeVersion: "26.5"
packages:
  Iroh:
    url: https://github.com/n0-computer/iroh-ffi.git
    exactVersion: 1.2.0
settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.5"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    DEVELOPMENT_TEAM: "$(DSH_DEVELOPMENT_TEAM)"
    CODE_SIGN_STYLE: Automatic
    APS_ENVIRONMENT: development
  configs:
    Release:
      APS_ENVIRONMENT: production
targets:
  DshMobile:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Resources
        buildPhase: resources
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: DSH Mobile
        DSHAPNsEnvironment: "$(APS_ENVIRONMENT)"
        DSHSigningTeam: "$(DEVELOPMENT_TEAM)"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIApplicationSupportsIndirectInputEvents: true
        NSCameraUsageDescription: Scan a pairing code on your computer to connect to DeepSeek Harness.
        NSLocalNetworkUsageDescription: Connect directly to your paired DeepSeek Harness computer on the local network.
        UIBackgroundModes:
          - remote-notification
    entitlements:
      path: DshMobile.entitlements
      properties:
        aps-environment: "$(APS_ENVIRONMENT)"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.gongshichen.dshmobile
        PRODUCT_NAME: DshMobile
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
        TARGETED_DEVICE_FAMILY: "1,2"
        FRAMEWORK_SEARCH_PATHS:
          - "$(inherited)"
          - "$(SRCROOT)/../composeApp/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)"
        OTHER_LDFLAGS:
          - "$(inherited)"
          - "-framework DshMobile"
          - "-lsqlite3"
    dependencies:
      - package: Iroh
        product: IrohLib
    preBuildScripts:
      - name: Build shared Kotlin framework
        script: |
          set -eu
          cd "$SRCROOT/.."
          ./gradlew :composeApp:embedAndSignAppleFrameworkForXcode
        basedOnDependencyAnalysis: false
schemes:
  DshMobile:
    build:
      targets:
        DshMobile: all
    run:
      config: Debug
    archive:
      config: Release
